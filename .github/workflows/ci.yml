name: Python package CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
      - cron:  '0 0 * * 0'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install '.[dev]'
      - name: Check import sorting with isort
        run: |
          isort --check-only mutalyzer_spdi_parser tests
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=build/,docs/
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --select=B,C,E,F,W,T4,B9 --ignore=E203,E266,E501,W503,F403,F401 --extend-exclude=build/,docs/
      - name: Test with pytest
        run: |
          pytest
