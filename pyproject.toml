[build-system]
requires = ['setuptools>=61']
build-backend = 'setuptools.build_meta'

[project]
name = 'mutalyzer_spdi_parser'
description = 'Mutalyzer SPDI variant description parser.'
version = '1.0.0'

authors = [
    {name = 'Mihai Lefter', email = 'M.Lefter@lumc.nl'}
]
readme = 'README.rst'
license = 'MIT'
keywords = ['Mutalyzer', 'HGVS', 'SPDI', 'description', 'parser', 'genomic']
urls = {Homepage = 'https://github.com/mutalyzer/spdi-parser'}
classifiers = [
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13'
    ]

requires-python = '>=3.10'
dependencies = ['lark>=1.0.0']

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ['mutalyzer_spdi_parser']

[project.scripts]
mutalyzer_spdi_parser = 'mutalyzer_spdi_parser.cli:main'

[project.optional-dependencies]
dev = [
    'build>=1.6.1',
    'fake-open>=0.0.1',
    'flake8>=7.4.1',
    'isort>=5.13.2',
    'pytest>=4.0.1',
    'twine>=7.0.0']

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
