[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = 'mutalyzer_spdi_parser'
description = 'Mutalyzer SPDI variant description parser.'
version = '1.0.0'

authors = [
    {name = 'LUMC, Mihai Lefter', email = 'M.Lefter@lumc.nl'}]
readme = 'README.rst'
urls = {Homepage = 'https://github.com/mutalyzer/spdi-parser'}
keywords = ['Mutalyzer', 'HGVS', 'SPDI', 'description', 'parser', 'genomic']
license = 'MIT'
classifiers = [
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics']

requires-python = '>=3.9'
dependencies = ['lark>=1.0.0']

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ['mutalyzer_spdi_parser']

[project.scripts]
mutalyzer_spdi_parser = 'mutalyzer_spdi_parser.cli:main'

[project.optional-dependencies]
dev = [
    'pytest>=4.0.1',
    'ruff>=0.17.0']
release = [
    'build>=1.6.1',
    'twine>=7.0.0']

[tool.ruff]
line-length = 89

[tool.ruff.lint]
select = ['C90', 'E', 'F', 'I', 'W']
ignore = ['E501', 'F401', 'F403']

[tool.ruff.lint.mccabe]
max-complexity = 18
